<div class="login-page">

  <!-- Panel izquierdo -->
  <div class="login-panel">

    <!-- Logo -->
    <div class="login-logo">
      <img src="assets/logo.png" alt="Logo" class="logo-img" />
      <span>Riego Inteligente</span>
    </div>

    <h1 class="login-title">Bienvenido de vuelta</h1>
    <p class="login-subtitle">Inicia sesión para continuar</p>

    <!-- Error -->
    <div class="error-msg" *ngIf="error">
      {{ error }}
    </div>

    <!-- Formulario -->
    <div class="form-group">
      <label>Usuario</label>
      <input
        type="text"
        [(ngModel)]="usuario"
        placeholder="Usuario"
        class="form-input"
      />
    </div>

    <div class="form-group">
      <label>Contraseña</label>
      <div class="input-password">
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          placeholder="Contraseña"
          class="form-input"
        />
        <button class="toggle-eye" (click)="togglePassword()" type="button">
          {{ mostrarPassword ? '' : '' }}
        </button>
      </div>
      <a routerLink="/recuperar" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>

    <button class="btn-submit" (click)="iniciarSesion()">
      Iniciar sesión
    </button>

    <p class="register-link">
      ¿No tienes cuenta?
      <a routerLink="/registro">Regístrate</a>
    </p>

  </div>

  <!-- Panel derecho: imagen -->
 <div class="imagen-login">
    <img src="assets/imagen-login.png" alt ="imagen login" class="imagen-login" />
 </div>
</div>
